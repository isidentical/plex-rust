[package]
name = "plex-rust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A native macOS client for Plex"

[lints]
workspace = true

[dependencies]
player = { path = "../player" }
plex = { path = "../plex" }

block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-media-player = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
objc2-open-gl = "0.3.2"
objc2-quartz-core = { version = "0.3.2", features = ["objc2-core-graphics", "objc2-core-video", "objc2-open-gl"] }
rustix = { version = "1.1", features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "time"] }
objc2-image-io = "0.3.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net"] }
