[env]
# The static libmpv built by scripts/build-libmpv.sh is the only place
# pkg-config may look, so a Homebrew mpv can never be linked by accident.
PKG_CONFIG_LIBDIR = { value = "vendor/libmpv/lib/pkgconfig", relative = true, force = true }
# Must match the deployment target in scripts/build-libmpv.sh.
MACOSX_DEPLOYMENT_TARGET = "26.0"
